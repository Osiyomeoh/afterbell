name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsc --noEmit -p app
      - run: npm test
      # Private protection has its own pnpm install (the Helius SDK builds from Git) and imports the SDK above.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: privacy/package.json
      - run: pnpm --dir privacy install --frozen-lockfile
      - run: pnpm --dir privacy check

  evm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
      - run: forge test

  slither:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install slither-analyzer==0.11.6
      # Fails on any finding of low severity or above that isn't suppressed with a reason in the source.
      - run: slither . --config-file slither.config.json --fail-low

  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The whole history, every branch; .gitleaksignore lists the public addresses it would otherwise flag.
      - working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - run: ${{ runner.temp }}/gitleaks git --no-banner --redact --log-opts="--all"

  solana:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: solana
    env:
      # The Agave release (cargo-build-sbf) and the platform tools it compiles
      # with, pinned to the sha256 digests GitHub publishes for these assets.
      AGAVE_VERSION: v4.1.2
      AGAVE_SHA256: 5991d027a686eb419a709a479178b33eb83501e8a2bfbf599a81a286bfcbf770
      PLATFORM_TOOLS_VERSION: v1.54
      PLATFORM_TOOLS_SHA256: fcc41631c7f77561bf5412218bf297501dccf0305ea280f338f0ace2aab9f31e
    steps:
      - uses: actions/checkout@v4
      - name: Cache the Solana tools
        id: tools
        uses: actions/cache@v4
        with:
          path: |
            ~/solana-release
            ~/.cache/solana/${{ env.PLATFORM_TOOLS_VERSION }}
          key: solana-tools-${{ env.AGAVE_VERSION }}-${{ env.PLATFORM_TOOLS_VERSION }}
      # Each archive is saved to a file and checked against its digest before
      # it's unpacked; nothing downloaded is run as an installer. The platform
      # tools go where cargo-build-sbf looks, so it doesn't fetch its own.
      - name: Download and check the Solana tools
        if: steps.tools.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o agave.tar.bz2 "https://github.com/anza-xyz/agave/releases/download/${AGAVE_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          echo "${AGAVE_SHA256}  agave.tar.bz2" | sha256sum -c -
          tar -xjf agave.tar.bz2 -C "$HOME"
          curl -fsSL -o platform-tools.tar.bz2 "https://github.com/anza-xyz/platform-tools/releases/download/${PLATFORM_TOOLS_VERSION}/platform-tools-linux-x86_64.tar.bz2"
          echo "${PLATFORM_TOOLS_SHA256}  platform-tools.tar.bz2" | sha256sum -c -
          mkdir -p "$HOME/.cache/solana/${PLATFORM_TOOLS_VERSION}/platform-tools"
          tar -xjf platform-tools.tar.bz2 -C "$HOME/.cache/solana/${PLATFORM_TOOLS_VERSION}/platform-tools"
      - run: echo "$HOME/solana-release/bin" >> "$GITHUB_PATH"
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - run: cargo test -p afterbell-vault --lib
      # The LiteSVM tests load the compiled programs from target/deploy: the vault, and the
      # cover-desk example that buys from it by CPI (its own workspace, so it's built on its own).
      - run: cargo build-sbf
      - run: cargo build-sbf --manifest-path examples/cover-desk/Cargo.toml --sbf-out-dir target/deploy
      - run: cargo test -p afterbell-vault --tests
