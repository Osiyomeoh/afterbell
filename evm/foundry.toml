[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 10_000
# The deploy script reads the feeds to allow from the stock list.
fs_permissions = [{ access = "read", path = "../research/data/robinhood-stocks.json" }]
# Fork tests need the network; they run under FOUNDRY_PROFILE=fork.
no_match_contract = "Fork"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.fork]
no_match_contract = "^$"
match_contract = "Fork"

[fuzz]
runs = 2_000

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
