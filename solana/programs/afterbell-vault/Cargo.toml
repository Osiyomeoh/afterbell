[package]
name = "afterbell-vault"
version = "0.1.0"
description = "Protection on a tokenized stock's next opening print, sold against signed quotes and settled by the first Pyth print after the bell"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "afterbell_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = "1.2.0"
# `pro-compatible` targets the upgraded Pyth receiver (rec2HHDD...) Pyth Core moved to on 2026-08-26.
pyth-solana-receiver-sdk = { version = "2.0.0", features = ["pro-compatible"] }
# Reading the ed25519 verification instruction that precedes `buy`; the versions Anchor already uses.
solana-instructions-sysvar = "3.0.0"
solana-sdk-ids = "3.1.0"

[dev-dependencies]
litesvm = { version = "0.10.0", features = ["precompiles"] }  # the Ed25519 program
litesvm-token = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3.2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
